# Results Directory Manifest
# Description of .mat files stored in the 'results/' folder

files:
  - filename: scan_results.mat
    description: >
      Dataset audit summary generated by 'scan_dataset.m' for SpaceNet 3
      (AOI_3_Paris). Contains per-tile image validity metrics and aggregated
      road network attribute distributions across the entire training set.
    generated_by: scan_dataset.m
    variables:
      - name: T
        type: table
        dimensions: Nx4
        description: Per-tile summary table across all N raster images in the dataset.
        columns:
          - name: id
            type: string
            description: Unique tile identifier extracted from the filename (e.g., "img123").
          - name: validPixels
            type: double
            description: Percentage of valid (non-zero/non-black) pixels across spectral bands (0-100).
          - name: nLines
            type: double
            description: Number of continuous road segments extracted from the corresponding GeoJSON file.
          - name: hasGroundTruth
            type: logical
            description: Boolean flag indicating whether the tile has a non-empty road ground truth.

      - name: allRoadTypes
        type: double
        dimensions: 1xM
        description: >
          Aggregated rtype codes across all M road segments in the dataset
          (1=motorway, 2=primary, 3=secondary, 4=tertiary, 5=residential,
          6=unclassified, 7=cart_track, 8=footpath, NaN=unknown).

      - name: allPaved
        type: double
        dimensions: 1xM
        description: >
          Aggregated paved surface indicators across all M road segments
          (1=paved, 2=unpaved, NaN=unknown).

      - name: allLanes
        type: double
        dimensions: 1xM
        description: >
          Aggregated lane counts across all M road segments in the dataset
          (NaN if missing or unspecified).

  - filename: split.mat
    description: >
      Deterministic dataset partition generated by 'make_split.m' (seeded with
      rng(42)) from usable tiles in 'scan_results.mat'. Splits positive road
      tiles into development and test sets, and isolates clean background tiles
      as negative examples.
    generated_by: make_split.m
    variables:
      - name: devIds
        type: string
        dimensions: 50x1
        description: >
          Tile IDs allocated to the development set, randomly sampled from
          usable tiles (hasGroundTruth == true and validPixels >= minValidPixels).

      - name: testIds
        type: string
        dimensions: Kx1
        description: >
          Remaining usable tile IDs (K = total usable tiles - 50) allocated
          to the evaluation/test set.

      - name: negIds
        type: string
        dimensions: Jx1
        description: >
          Tile IDs without road ground truth (hasGroundTruth == false) and
          100% valid pixels, reserved as pure negative/background samples.

  - filename: band_ranking.mat
    description: >
      Feature separability ranking generated by 'rank_band_pairs.m' on the
      development set (devIds). Evaluates all 28 unique WorldView-3 normalized
      difference band pairs and 5 spectral indices using ROC-AUC to measure
      road vs. background separability.
    generated_by: rank_band_pairs.m
    variables:
      - name: Rk
        type: table
        dimensions: 33x4
        description: >
          Feature ranking table sorted in descending order of separability
          across 28 normalized band pairs and 5 spectral indices.
        columns:
          - name: index
            type: cellstr
            description: >
              Feature name, formatted as 'ND(B1,B2)' for band pairs or the
              spectral index name ('NDVI', 'NDWI', 'REI', 'BAI', 'Brightness').
          - name: AUC
            type: double
            description: >
              Area Under the ROC Curve (0 to 1) measuring discrimination power
              between eroded road pixels and dilated background pixels.
          - name: sign
            type: double
            description: >
              Direction of discrimination (+1 if road values > background
              values, -1 if road values < background values, 0 if AUC == 0.5).
          - name: separability
            type: double
            description: >
              Direction-invariant separability score computed as
              abs(AUC - 0.5) * 2 (0 = random/uninformative, 1 = perfect separation).
